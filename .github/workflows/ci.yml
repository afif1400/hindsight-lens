name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: lens
          POSTGRES_DB: lens
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest (SQLite)
        run: pytest
      - name: pytest (Postgres)
        run: pytest
        env:
          LENS_TEST_DATABASE_URL: postgresql+psycopg://postgres:lens@localhost:5432/lens

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build            # formatting, typecheck and tests first
      - name: lens/dashboard.html is built from web/
        run: git diff --exit-code ../lens/dashboard.html || (echo "Run 'pnpm build' in web/ and commit lens/dashboard.html" && exit 1)
