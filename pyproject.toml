[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hindsight-lens"
version = "0.1.0"
description = "Read-only collector that keeps a durable history of what Hindsight believes about each user"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff==0.16.10", "pre-commit>=4"]

[project.scripts]
lens = "lens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned rather than ruff's defaults, which widen between releases.
select = ["E4", "E7", "E9", "F", "I"]
